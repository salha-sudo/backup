global:
  scrape_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: rest-server
    metrics_path: /metrics
    scheme: https
    tls_config:
      insecure_skip_verify: true
    static_configs:
      - targets: ["rest-server:8000"]
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
